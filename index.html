<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recomendaciones de cine</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <main class="movie" id="movie">
        <div class="content">

            <section class="panel panel-form">
                <p class="eyebrow" id="eyebrow">RECOMENDACIONES DE PELÍCULAS</p>

                <h1 id="title">Soy tu asesor de cine</h1>

                <p class="description" id="movie-description">
                    Cuéntame tu edad y te sugiero películas que te pueden interesar.
                </p>

                <form id="age-form">
                    <label for="age">Ingresa tu edad:</label>
                    <div class="form-row">
                        <input type="number" id="age" name="age" placeholder="Ej: 18" min="1" max="120" required>
                        <button type="submit">Recomendar película</button>
                        <button type="button" id="clear-btn" class="btn-clear">Borrar búsqueda</button>
                    </div>
                </form>
            </section>

            <section class="panel panel-result">
                <div id="recommendation" class="recommendation" aria-live="polite"></div>
            </section>

        </div>
    </main>

    <script src="js/app.js"></script>
</body>
</html>
